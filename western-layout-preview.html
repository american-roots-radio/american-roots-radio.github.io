<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>American Roots — Western Desktop Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305}
iframe{display:block;width:100%;height:100%;border:0;background:#020305}
</style>
</head>
<body>
<iframe id="site" src="index.html?western-layout-test=7" title="American Roots western desktop test"></iframe>
<script>
const frame = document.getElementById('site');

frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  if (!doc) return;

  const base = doc.createElement('link');
  base.rel = 'stylesheet';
  base.href = 'western-desktop.css?v=7';
  doc.head.appendChild(base);

  const finish = doc.createElement('link');
  finish.rel = 'stylesheet';
  finish.href = 'western-finish.css?v=7';
  doc.head.appendChild(finish);
});
</script>
</body>
</html>
