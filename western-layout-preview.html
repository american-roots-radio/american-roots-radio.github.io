<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>American Roots — Western Desktop Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305}
iframe{display:block;width:100%;height:100%;border:0;background:#020305;visibility:hidden}
iframe.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="site" src="index.html?western-layout-test=23" title="American Roots western desktop test"></iframe>
<script>
const frame = document.getElementById('site');

frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  if (!doc || !win) {
    frame.classList.add('ready');
    return;
  }

  if (!win.matchMedia('(min-width: 901px)').matches) {
    frame.classList.add('ready');
    return;
  }

  const loadStyle = href => new Promise(resolve => {
    const link = doc.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.addEventListener('load', resolve, { once: true });
    link.addEventListener('error', resolve, { once: true });
    doc.head.appendChild(link);
  });

  const loadScript = src => new Promise(resolve => {
    const script = doc.createElement('script');
    script.src = src;
    script.addEventListener('load', resolve, { once: true });
    script.addEventListener('error', resolve, { once: true });
    doc.head.appendChild(script);
  });

  (async () => {
    await loadStyle('western-desktop.css?v=9');
    await loadStyle('western-finish.css?v=9');
    await loadStyle('western-width-test.css?v=23');
    await loadScript('western-extra-stations.js?v=1');

    const searchInput = doc.querySelector('.compact-secondary-controls .search-box, .search-wrap input[type="search"], .search-wrap input');
    if (searchInput) {
      const fixedSearchPlaceholder = 'Search station';
      searchInput.setAttribute('placeholder', fixedSearchPlaceholder);
      const searchPlaceholderObserver = new MutationObserver(() => {
        if (searchInput.getAttribute('placeholder') !== fixedSearchPlaceholder) {
          searchInput.setAttribute('placeholder', fixedSearchPlaceholder);
        }
      });
      searchPlaceholderObserver.observe(searchInput, { attributes: true, attributeFilter: ['placeholder'] });
    }

    const allFilterButton = doc.getElementById('btn-all');
    if (allFilterButton && allFilterButton.parentElement) {
      const countryCount = doc.querySelector('#family-country-btn .family-count')?.textContent?.trim() || '126';
      const measureButton = allFilterButton.cloneNode(true);
      measureButton.removeAttribute('id');
      measureButton.textContent = `All Country (${countryCount})`;
      measureButton.style.setProperty('position', 'absolute', 'important');
      measureButton.style.setProperty('visibility', 'hidden', 'important');
      measureButton.style.setProperty('pointer-events', 'none', 'important');
      measureButton.style.setProperty('width', 'auto', 'important');
      measureButton.style.setProperty('min-width', '0', 'important');
      measureButton.style.setProperty('max-width', 'none', 'important');
      measureButton.style.setProperty('flex', 'none', 'important');
      allFilterButton.parentElement.appendChild(measureButton);
      const countryAllWidth = Math.ceil(measureButton.getBoundingClientRect().width);
      measureButton.remove();

      if (countryAllWidth > 0) {
        allFilterButton.style.setProperty('width', `${countryAllWidth}px`, 'important');
        allFilterButton.style.setProperty('min-width', `${countryAllWidth}px`, 'important');
        allFilterButton.style.setProperty('max-width', `${countryAllWidth}px`, 'important');
        allFilterButton.style.setProperty('flex', `0 0 ${countryAllWidth}px`, 'important');
      }
    }

    const appearanceMenu = doc.querySelector('.appearance-menu');
    if (appearanceMenu) {
      doc.addEventListener('click', event => {
        if (appearanceMenu.open && !appearanceMenu.contains(event.target)) {
          appearanceMenu.open = false;
          appearanceMenu.removeAttribute('open');
        }
      });
    }

    const mainAudio = doc.getElementById('main-audio');
    if (mainAudio && typeof win.clearNowPlayingLine === 'function') {
      mainAudio.addEventListener('play', () => {
        win.clearNowPlayingLine();
      });
    }

    const horseCss = await fetch('western-horse-final.css?v=15', { cache: 'no-store' });
    if (!horseCss.ok) throw new Error(`Horse CSS ${horseCss.status}`);
    const horseText = await horseCss.text();
    const horseMatch = horseText.match(/data:image\/webp;base64,([^"')]+)/);
    if (!horseMatch) throw new Error('Horse WebP data not found');

    const raw = atob(horseMatch[1]);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);

    const isWebP = bytes.length >= 12 &&
      bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
      bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;
    if (!isWebP) throw new Error('Horse asset is not a RIFF WebP');

    const riffPayloadSize = (
      bytes[4] |
      (bytes[5] << 8) |
      (bytes[6] << 16) |
      (bytes[7] << 24)
    ) >>> 0;
    const webpLength = riffPayloadSize + 8;
    if (webpLength > bytes.length) throw new Error('Horse WebP is truncated');

    const cleanBytes = bytes.slice(0, webpLength);
    const horseUrl = URL.createObjectURL(new Blob([cleanBytes], { type: 'image/webp' }));

    const horseLayer = doc.createElement('img');
    horseLayer.id = 'western-horse-final-layer';
    horseLayer.alt = '';
    horseLayer.setAttribute('aria-hidden', 'true');
    horseLayer.src = horseUrl;
    horseLayer.style.cssText = [
      'position:fixed',
      'left:calc(69.42vw + 24px)',
      'top:36.2vh',
      'width:30.58vw',
      'height:54.96vh',
      'object-fit:fill',
      'pointer-events:none',
      'user-select:none',
      'z-index:9'
    ].join(';');

    await horseLayer.decode();
    doc.body.appendChild(horseLayer);

    const stacking = doc.createElement('style');
    stacking.textContent = `
@media (min-width:901px) {
  header,
  .container {
    position: relative !important;
    z-index: 10 !important;
  }
  body .bottom-player {
    z-index: 1000 !important;
  }
}`;
    doc.head.appendChild(stacking);

    await loadStyle('western-player-final.css?v=15');
  })()
    .catch(error => console.error('Western preview:', error))
    .finally(() => frame.classList.add('ready'));
});
</script>
</body>
</html>
