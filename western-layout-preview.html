<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>American Roots — Western Desktop Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305}
iframe{display:block;width:100%;height:100%;border:0;background:#020305;visibility:hidden}
iframe.ready{visibility:visible}
</style>
</head>
<body>
<iframe id="site" src="index.html?western-layout-test=14" title="American Roots western desktop test"></iframe>
<script>
const frame = document.getElementById('site');

frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  if (!doc || !win) {
    frame.classList.add('ready');
    return;
  }

  if (!win.matchMedia('(min-width: 901px)').matches) {
    frame.classList.add('ready');
    return;
  }

  const loadStyle = href => new Promise(resolve => {
    const link = doc.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.addEventListener('load', resolve, { once: true });
    link.addEventListener('error', resolve, { once: true });
    doc.head.appendChild(link);
  });

  (async () => {
    await loadStyle('western-desktop.css?v=9');
    await loadStyle('western-finish.css?v=9');

    const horseCss = await fetch('western-horse-final.css?v=14', { cache: 'no-store' });
    if (!horseCss.ok) throw new Error(`Horse CSS ${horseCss.status}`);
    const horseText = await horseCss.text();
    const horseMatch = horseText.match(/data:image\/webp;base64,([^"')]+)/);
    if (!horseMatch) throw new Error('Horse WebP data not found');

    const horseLayer = doc.createElement('img');
    horseLayer.id = 'western-horse-final-layer';
    horseLayer.alt = '';
    horseLayer.setAttribute('aria-hidden', 'true');
    horseLayer.src = `data:image/webp;base64,${horseMatch[1]}`;
    horseLayer.style.cssText = [
      'position:fixed',
      'left:calc(69.42vw + 24px)',
      'top:36.2vh',
      'width:30.58vw',
      'height:54.96vh',
      'object-fit:fill',
      'pointer-events:none',
      'user-select:none',
      'z-index:5'
    ].join(';');

    await horseLayer.decode();
    doc.body.appendChild(horseLayer);

    const stacking = doc.createElement('style');
    stacking.textContent = `
@media (min-width:901px) {
  header,
  .container {
    position: relative !important;
    z-index: 10 !important;
  }
  body .bottom-player {
    z-index: 1000 !important;
  }
}`;
    doc.head.appendChild(stacking);

    await loadStyle('western-player-final.css?v=14');
  })()
    .catch(error => console.error('Western preview:', error))
    .finally(() => frame.classList.add('ready'));
});
</script>
</body>
</html>
