name: Fix Country Controls Alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-country-controls-alignment.yml'

permissions:
  contents: write

jobs:
  patch-country-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted desktop alignment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          station_pattern = re.compile(r'\{\s*id:\s*\d+,\s*name:')
          before_count = len(station_pattern.findall(text))
          if before_count != 228:
              raise SystemExit(f'Refusing patch: expected 228 station definitions, found {before_count}')

          old = '''    /* Blues/Gospel only: let Search absorb remaining desktop space so Share reaches the Country right edge. */
              .controls-compact[data-family="blues"] .compact-secondary-controls .search-wrap,
              .controls-compact[data-family="gospel"] .compact-secondary-controls .search-wrap {
                  flex: 1 1 370px !important;
                  width: auto !important;
                  max-width: none !important;
              }
          '''

          new = '''    /* Desktop: let Search absorb remaining space so Theme reaches the same right edge for every family. */
              .controls-compact[data-family="country"] .compact-secondary-controls .search-wrap,
              .controls-compact[data-family="blues"] .compact-secondary-controls .search-wrap,
              .controls-compact[data-family="gospel"] .compact-secondary-controls .search-wrap {
                  flex: 1 1 370px !important;
                  width: auto !important;
                  max-width: none !important;
              }
          '''

          if text.count(old) != 1:
              raise SystemExit(f'Refusing patch: target CSS block matched {text.count(old)} times instead of exactly once')

          updated = text.replace(old, new, 1)
          after_count = len(station_pattern.findall(updated))
          if after_count != 228:
              raise SystemExit(f'Refusing patch: station count changed to {after_count}')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify only intended file changed
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q 'data-family="country".*compact-secondary-controls.*search-wrap' index.html

      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align Country controls with Blues and Gospel"
          git push origin HEAD:main
