name: ChatGPT Share Button Restore

on:
  push:
    branches:
      - chatgpt-share-button-restore

permissions:
  contents: write

jobs:
  restore-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Share button safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          before = s

          old_button = '<button id="share-station-btn" class="btn-share-station compact-share" type="button" onclick="shareCurrentStation()" style="display:none;">🔗 Share</button>'
          new_button = '<button id="share-station-btn" class="btn-share-station compact-share" type="button" onclick="shareCurrentStation()">🔗 Share</button>'
          assert s.count(old_button) == 1, f'Expected one hidden Share button, found {s.count(old_button)}'
          s = s.replace(old_button, new_button, 1)

          old_logic = "            if (!currentStation) return;\n            const shareUrl = getStationShareUrl(currentStation);"
          new_logic = "            const shareUrl = currentStation\n                ? getStationShareUrl(currentStation)\n                : `${window.location.origin}${window.location.pathname}`;"
          assert s.count(old_logic) == 1, f'Expected one old Share URL block, found {s.count(old_logic)}'
          s = s.replace(old_logic, new_logic, 1)

          old_data = "                title: currentStation.name,\n                text: `Listen to ${currentStation.name} on American Roots Radio Hub`,"
          new_data = "                title: currentStation ? currentStation.name : 'American Roots Radio Hub',\n                text: currentStation\n                    ? `Listen to ${currentStation.name} on American Roots Radio Hub`\n                    : 'Listen to live Country, Blues and Gospel radio on American Roots Radio Hub',"
          assert s.count(old_data) == 1, f'Expected one old Share data block, found {s.count(old_data)}'
          s = s.replace(old_data, new_data, 1)

          station_re = re.compile(r'^\s*\{ id: (\d+), name: .*? url: .*? \},?\s*$', re.M)
          before_ids = station_re.findall(before)
          after_ids = station_re.findall(s)
          assert len(before_ids) == 228, f'Before station count != 228: {len(before_ids)}'
          assert len(after_ids) == 228, f'After station count != 228: {len(after_ids)}'
          assert [int(x) for x in after_ids] == list(range(1, 229)), 'Station IDs are not exactly 1..228'
          before_station_lines = [ln for ln in before.splitlines() if station_re.match(ln)]
          after_station_lines = [ln for ln in s.splitlines() if station_re.match(ln)]
          assert before_station_lines == after_station_lines, 'A station definition line changed'

          assert old_button not in s
          assert new_button in s
          assert "title: currentStation ? currentStation.name : 'American Roots Radio Hub'" in s
          p.write_text(s)
          print('GUARD OK: Share visible on load; 228 station lines unchanged.')
          PY

          git diff --check
          git diff -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore persistent Share button"
          git push
