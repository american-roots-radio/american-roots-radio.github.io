name: ChatGPT Share Button Restore

on:
  push:
    branches:
      - chatgpt-share-button-restore

permissions:
  contents: read

jobs:
  inspect-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Share wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '===== BUTTON ====='
          grep -n -C 4 'share-station-btn' index.html || true
          echo '===== FUNCTION ====='
          grep -n -A 35 -B 5 'async function shareCurrentStation' index.html || true
