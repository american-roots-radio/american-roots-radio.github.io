name: Temporary delete theme test branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-theme-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete theme test branch
        run: git push origin --delete test-themes
