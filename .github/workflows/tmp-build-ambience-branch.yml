name: Temporary builder for ambience test branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-build-ambience-branch.yml'

permissions:
  contents: write

jobs:
  build-test-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-ambiances
      - name: Patch ambience test
        run: python .github/ambience_patch.py
      - name: Commit test branch
        run: |
          git config user.name "american-roots-radio"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add background ambience test panel" || exit 0
          git push origin test-ambiances
