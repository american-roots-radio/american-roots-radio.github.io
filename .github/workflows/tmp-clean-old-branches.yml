name: Temporary cleanup old branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-clean-old-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old backup branches
        run: |
          git push origin --delete \
