name: Temporary build theme test branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-build-theme-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-themes
          fetch-depth: 0
      - name: Patch theme test
        run: python .github/theme_test_patch.py
      - name: Commit test branch
        run: |
          git config user.name "american-roots-radio"
          git config user.email "mgena0306@icloud.com"
          git add index.html
          git commit -m "Add standard Light and Dark test themes"
          git push origin HEAD:test-themes
